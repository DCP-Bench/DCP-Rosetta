name: Evaluation checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'evaluation/**'
      - 'solvers/**'
      - 'runner/**'
      - 'generation/**'
      - 'skills/**'
      - 'tests/**'
      - 'bench'
      - 'eval.py'
      - 'requirements.txt'
      - '.gitattributes'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:
jobs:
  evaluation:
    runs-on: ubuntu-latest
    # The apt snapshot mirrors alone took evaluation.build from 13 to 26 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_evaluation tests.test_generation tests.test_skill_workflow tests.test_readiness -v
      - run: make validate-skills
      - run: python -m generation.next_work --limit 1
      - run: python -m evaluation.build
      - run: python -m unittest tests.test_solvers tests.test_generation_containers -v
        env:
          DCP_CONTAINER_TESTS: '1'
      - name: Kernel OOM log
        if: failure()
        run: sudo dmesg --ctime | grep -i -E 'oom|killed process' || echo "No OOM entries in the kernel log"
