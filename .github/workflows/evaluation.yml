name: Evaluation checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'evaluation/**'
      - 'solvers/**'
      - 'runner/**'
      - 'generation/**'
      - 'skills/**'
      - 'tests/**'
      - 'bench'
      - 'eval.py'
      - 'requirements.txt'
      - '.gitattributes'
      - '.github/workflows/evaluation.yml'
  workflow_dispatch:
jobs:
  evaluation:
    runs-on: ubuntu-latest
    # With an empty layer cache, evaluation.build takes about 39 minutes: 26 from
    # the slow apt snapshot mirrors, the rest writing the cache and loading images.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_evaluation tests.test_generation tests.test_skill_workflow tests.test_readiness -v
      - run: make validate-skills
      - run: python -m generation.next_work --limit 1
      - uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          use: false
      # Exposes the cache service's URL and token, which only actions see by default.
      - uses: crazy-max/ghaction-github-runtime@v4
      - run: python -m evaluation.build --gha-cache
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
      - run: python -m unittest tests.test_solvers tests.test_generation_containers -v
        env:
          DCP_CONTAINER_TESTS: '1'
      - name: Kernel OOM log
        if: failure()
        run: sudo dmesg --ctime | grep -i -E 'oom|killed process' || echo "No OOM entries in the kernel log"
